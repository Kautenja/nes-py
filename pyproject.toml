[build-system]
requires = [
    "Cython>=3.0",
    "numpy>=2.1",
    "scikit-build-core>=0.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "nes_py"
version = "9.0.0"
description = "An NES Emulator and Gymnasium interface"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Christian Kauten", email = "kautencreations@gmail.com"},
]
keywords = ["NES", "Emulator", "Gymnasium"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Emulators",
]
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.18.5",
    "pyglet<=1.5.21,>=1.4.0",
    "tqdm>=4.48.2",
]

[project.scripts]
nes_py = "nes_py.play:main"

[project.urls]
Homepage = "https://github.com/Kautenja/nes-py"
Repository = "https://github.com/Kautenja/nes-py"

[tool.scikit-build]
minimum-version = "build-system.requires"
sdist.include = ["nes_emu/**"]
sdist.exclude = [
    ".clang_complete",
    ".github/**",
    ".gitignore",
    "__main__.py",
    "docs/**",
    "makefile",
    "nes_py/tests/**",
    "requirements.txt",
    "scripts/**",
]
wheel.exclude = ["nes_py/tests/**"]

[tool.cibuildwheel]
build = "cp313-*"
skip = "*-musllinux_*"
test-command = 'python -c "import nes_py; import nes_py._native"'
build-verbosity = 1
